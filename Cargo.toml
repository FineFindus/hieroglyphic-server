[package]
name = "hieroglyphic"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
serde = "1.0"
serde_json = "1.0"
shuttle-axum = "0.51"
shuttle-runtime = "0.51"
shuttle-shared-db = { version = "0.51.0", features = ["mongodb"] }
mongodb = "3.2"
tokio = "1.28.2"
tracing = "0.1.40"
# TODO: this is an old version of the classifier used by Hieroglyphic,
# migrate to the newer one if the two diverge
detexify = { git = "https://github.com/FineFindus/detexify-rust.git", rev = "311002feb0519f483ef1f9cc8206648286128ff5" }
