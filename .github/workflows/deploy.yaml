on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

name: Deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy server
        uses: shuttle-hq/deploy-action@v2
        with:
          shuttle-api-key: ${{ secrets.SHUTTLE_API_KEY }}
          project-id: proj_01JJFC5FVKMXDZEPCNBPMFD8DZ
          secrets: |
            MONGODB_URI = '${{ secrets.MONGODB_URI }}'
